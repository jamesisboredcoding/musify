[package]
name = "musify"
version = "0.1.0"
edition = "2024"
description = "A music player for Linux"
license = "MIT"

[features]
default = ["audio"]
# Real playback through rodio (needs alsa-lib-devel to build).
# Without it Musify still runs, with a silent clock standing in for the audio device.
audio = ["dep:rodio"]

[dependencies]
dirs = "7.0.0"
discord-rich-presence = "1.1.0"
iced = { version = "0.14", features = ["canvas", "tokio", "image", "advanced", "svg"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.25"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
rodio = { version = "0.23", optional = true }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
tokio = { version = "1", features = ["fs", "macros", "process", "rt", "time"] }
walkdir = "2.5.0"

[profile.dev.package."*"]
opt-level = 2

# iced_winit with one fix: fullscreen goes to the monitor the window is on (see vendor/iced_winit/src/lib.rs, SetMode).
[patch.crates-io]
iced_winit = { path = "vendor/iced_winit" }
